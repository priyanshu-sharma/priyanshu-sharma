[project]
name = "priyanshu-sharma"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.4",
    "fastapi[standard]>=0.136.1",
    "gunicorn>=25.3.0",
    "python-fasthtml",
    "uvicorn",
    "pydantic-settings",
    "dj-database-url",
    "python-dotenv",
    "pydantic-redis>=0.7.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "pytest",
    "isort>=8.0.1",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["F403", "F405"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
# Exclude the project root from mypy checks
exclude = ["priyanshu-sharma", "tests"]

[tool.isort]
profile = "black"

[tool.fastapi]
entrypoint = "core_app.app:core_app"